<div class="form-container">
  <h3>{{ fashion._id ? 'Edit Fashion' : 'Add New Fashion' }}</h3>
  
  <form>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" [(ngModel)]="fashion.title" name="title" placeholder="Enter fashion title" required />
    </div>

    <div class="form-group">
      <label>Style *</label>
      <input type="text" [(ngModel)]="fashion.style" name="style" placeholder="Enter style name" required />
    </div>

    <div class="form-group">
      <label>Detail</label>
      <textarea [(ngModel)]="fashion.detail" name="detail" placeholder="Enter fashion details" rows="4"></textarea>
    </div>

    <div class="form-group">
      <label>Thumbnail Image</label>
      <input type="file" name="thumbnail" accept="image/*" (change)="onFileSelected($event)" />
      <div *ngIf="fashion.thumbnail" class="image-preview">
        <img [src]="fashion.thumbnail" alt="Preview" />
      </div>
    </div>

    <div class="form-buttons">
      <button type="button" class="btn btn-save" (click)="save()">
        {{ fashion._id ? 'Update' : 'Create' }}
      </button>
      <button type="button" class="btn btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
